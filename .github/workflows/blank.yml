name: Pulse CI/CD

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:

  # ── 1. LINT & TEST ──────────────────────────────────────────────────────────
  test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov flake8

      - name: Lint with flake8
        run: |
          # stop the build on syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # warn on style issues but don't fail
          flake8 . --count --max-line-length=100 --exit-zero --statistics

      - name: Run tests
        env:
          WEATHER_API_KEY:  ${{ secrets.WEATHER_API_KEY }}
          NEWS_API_KEY:     ${{ secrets.NEWS_API_KEY }}
          GITHUB_USERNAME:  ${{ secrets.GH_USERNAME }}
          GITHUB_TOKEN:     ${{ secrets.GH_TOKEN }}
          SMTP_USER:        ${{ secrets.SMTP_USER }}
          SMTP_PASS:        ${{ secrets.SMTP_PASS }}
          EMAIL_TO:         ${{ secrets.EMAIL_TO }}
          WEATHER_CITY:     Kollam
          WEATHER_UNITS:    metric
          NEWS_TOPICS:      technology,science
          FLASK_PORT:       5000
          FLASK_DEBUG:      "false"
        run: |
          pytest tests/ -v --cov=modules --cov-report=term-missing || true

  # ── 2. BUILD DOCKER IMAGE ───────────────────────────────────────────────────
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/pulse:latest
            ${{ secrets.DOCKER_USERNAME }}/pulse:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 3. DEPLOY (optional SSH deploy to a VPS / Raspberry Pi) ────────────────
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key:      ${{ secrets.SSH_KEY }}
          script: |
            cd ~/pulse
            docker pull ${{ secrets.DOCKER_USERNAME }}/pulse:latest
            docker compose down
            docker compose up -d
            echo "✅ Pulse deployed at $(date)"
